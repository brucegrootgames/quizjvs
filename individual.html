      padding: 15px 30px;
      font-size: 1.1rem;
      color: white;
      background-color: #007BFF;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.3s;
      width: 250px;

    .boton:hover {

      background-color: #6c757d;
